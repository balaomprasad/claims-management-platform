spring:
  application:
    name: claimsphere
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claimsphere}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  kafka:
    # Default matches the host-facing listener exposed by docker-compose.yml.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: claimsphere-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.claimsphere.claim.event.ClaimEvent
        spring.json.trusted.packages: com.claimsphere.claim.event
        spring.json.use.type.headers: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  # Used when structured logging is disabled (LOG_FORMAT empty); ECS output includes MDC values automatically.
  pattern:
    level: "%5p [%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: claimsphere
    expiration: ${JWT_EXPIRATION:PT60M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  kafka:
    claim-events-topic: claimsphere.claim-events
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: 50
  storage:
    max-file-size-bytes: 10485760
    local:
      root: ${STORAGE_DIR:./data/uploads}
  demo:
    # Shared password for all seeded demo accounts (demo profile only). Nothing is seeded when blank.
    password: ${DEMO_PASSWORD:}
