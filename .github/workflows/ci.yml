name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral, CI-only database that exists for the lifetime of this job.
          POSTGRES_DB: claimsphere_test
          POSTGRES_USER: claimsphere
          POSTGRES_PASSWORD: claimsphere-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsphere -d claimsphere_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/claimsphere_test
      TEST_DB_USERNAME: claimsphere
      TEST_DB_PASSWORD: claimsphere-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  containers:
    name: Container images + Kubernetes manifests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t claimsphere-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -t claimsphere-frontend:${{ github.sha }} frontend
      - name: Render and validate Kubernetes manifests
        run: |
          cp infrastructure/kubernetes/secrets.env.example infrastructure/kubernetes/secrets.env
          kubectl kustomize infrastructure/kubernetes > rendered.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml
