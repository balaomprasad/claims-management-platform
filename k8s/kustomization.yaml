apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: claimsphere

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - kafka.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# Secrets are generated from a git-ignored file: cp secrets.env.example secrets.env, then edit values.
secretGenerator:
  - name: claimsphere-secrets
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: claimsphere-backend
    newTag: latest
  - name: claimsphere-frontend
    newTag: latest
