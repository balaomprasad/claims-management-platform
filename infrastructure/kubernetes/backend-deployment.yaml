apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # Single replica because uploaded documents live on a ReadWriteOnce volume (local storage adapter).
  # Scale out after switching FileStorage to object storage (S3 / Azure Blob) or a ReadWriteMany volume;
  # everything else (JWT, outbox relay with SKIP LOCKED, idempotent consumer) is already multi-replica safe.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: backend
          image: claimsphere-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: claimsphere-config
            - secretRef:
                name: claimsphere-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
